on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 #4.9.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Clean workspace
        run: |
          git add CHANGELOG.md
          git clean -fdx
          git status
          git diff --cached
          ls -la

      - name: Create Changelog Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update changelog after release
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          base: master
          branch: update_changelog
          delete-branch: true
          title: "Update changelog after release"
          body: |
            Automatic changelog update using git cliff
            - Auto-generated after latest release
            :artificial_satellite: :rocket: :newspaper:
          labels: |
            documentation
          assignees: RakuJa
          reviewers: RakuJa
          draft: false
